name: Build Deployer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore workloads
        run: dotnet workload restore Deployer.sln

      - name: Build and package with Nuke
        run: .\build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Deployer-v4-packages
          path: output/packages/**
          retention-days: 14

      - name: List packages
        run: dir output\packages
